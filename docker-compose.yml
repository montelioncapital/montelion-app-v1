services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      # 🔹 Twilio – utilisé par l’API /api/phone/send-code
      TWILIO_ACCOUNT_SID: "ACd421634cc5bf93a7c2f0a607473936ef"
      TWILIO_AUTH_TOKEN: "986552dd3d241b5774f5bc7ff083f900"
      TWILIO_VERIFY_SERVICE_SID: "VAe1918edb66615c56354bc83751dbda7f"

  caddy:
    image: caddy:2
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
